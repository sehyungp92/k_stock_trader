x-common-env: &common-env
  KIS_APP_KEY: ${KIS_APP_KEY}
  KIS_APP_SECRET: ${KIS_APP_SECRET}
  KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO}
  KIS_ACCOUNT_PROD_CODE: ${KIS_ACCOUNT_PROD_CODE:-01}
  KIS_IS_PAPER: ${KIS_IS_PAPER:-true}
  KIS_HTS_ID: ${KIS_HTS_ID:-}
  KIS_MY_AGENT: ${KIS_MY_AGENT:-Mozilla/5.0}
  KIS_PAPER_APP_KEY: ${KIS_PAPER_APP_KEY:-}
  KIS_PAPER_APP_SECRET: ${KIS_PAPER_APP_SECRET:-}
  KIS_PAPER_ACCOUNT_NO: ${KIS_PAPER_ACCOUNT_NO:-}
  RATE_BUDGET_STATE_FILE: /var/run/rate_budget/state.json

x-common: &common
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - kstock
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

x-strategy-base: &strategy-base
  <<: *common
  depends_on:
    oms:
      condition: service_healthy
  environment:
    <<: *common-env
    OMS_URL: http://oms:8000
    CONSERVATIVE_MODE: ${CONSERVATIVE_MODE:-false}
  healthcheck:
    test: ["CMD-SHELL", "sh /app/scripts/strategy_healthcheck.sh"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 120s

services:
  # ===========================================
  # OMS Service (always runs)
  # ===========================================
  oms:
    <<: *common
    build:
      context: .
      dockerfile: oms/Dockerfile
    container_name: oms
    ports:
      - "8000:8000"
    volumes:
      - ./data/oms:/app/data
      - rate_budget:/var/run/rate_budget
    environment:
      <<: *common-env
      OMS_PORT: "8000"
      DATABASE_URL: postgresql://trading_writer:${POSTGRES_WRITER_PASSWORD:-changeme}@postgres:5432/trading
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================
  # Strategy: PCIM
  # ===========================================
  pcim:
    <<: *strategy-base
    build:
      context: .
      dockerfile: strategy_pcim/Dockerfile
    container_name: pcim
    volumes:
      - ./config:/app/config:ro
      - ./data/pcim:/app/data
      - ./data/pcim/instrumentation:/app/instrumentation/data
      - rate_budget:/var/run/rate_budget
    environment:
      <<: *common-env
      OMS_URL: http://oms:8000
      PCIM_CONFIG: /app/config/pcim.yaml
      CONSERVATIVE_MODE: ${CONSERVATIVE_MODE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INSTRUMENTATION_HMAC_SECRET: ${INSTRUMENTATION_HMAC_SECRET:-}
      SIDECAR_RELAY_URL: ${SIDECAR_RELAY_URL:-}
    profiles:
      - pcim
      - all

  # ===========================================
  # OLR/KALCB Runtime: one-shot artifact, preflight, dry-run and paper jobs
  # ===========================================
  runtime:
    build:
      context: .
      dockerfile: deployment/olr_kalcb/Dockerfile
    env_file:
      - .env
    networks:
      - kstock
    volumes:
      - ./config:/app/config:ro
      - ./data/strategy:/app/data/strategy
      - ./data/backtests:/app/data/backtests:ro
      - ./data/paper_live:/app/data/paper_live
      - ./data/live_readiness:/app/data/live_readiness:ro
      - ./data/krx_daily_parquet:/app/data/krx_daily_parquet:ro
      - ./data/kis_intraday_parquet:/app/data/kis_intraday_parquet:ro
      - ./data/oms:/app/data/oms:ro
      - rate_budget:/var/run/rate_budget
    environment:
      <<: *common-env
      OMS_URL: http://oms:8000
      OLR_KALCB_BASELINE_MANIFEST: /app/data/live_readiness/olr_kalcb/2026-05-27/baseline_manifest.json
      OLR_KALCB_DAILY_UNIVERSE_FILE: ${OLR_KALCB_DAILY_UNIVERSE_FILE:-config/olr_kalcb/olr_deployment_universe_103.yaml}
      OLR_KALCB_PORTFOLIO_POLICY: /app/config/olr_kalcb/portfolio_policy.conservative.json
      OLR_KALCB_SECTOR_MAP: /app/config/olr/sector_map.yaml
      OLR_KALCB_RUNTIME_MODE: ${OLR_KALCB_RUNTIME_MODE:-dry_run}
      OLR_KALCB_TRADE_DATE: ${OLR_KALCB_TRADE_DATE:-}
      OLR_KALCB_BARS_PARQUET: ${OLR_KALCB_BARS_PARQUET:-}
      OLR_KALCB_SESSION_ROOT: ${OLR_KALCB_SESSION_ROOT:-}
      OLR_KALCB_HEALTH_CHECKS_JSON: ${OLR_KALCB_HEALTH_CHECKS_JSON:-}
      OLR_KALCB_ACCOUNT_STATE_JSON: ${OLR_KALCB_ACCOUNT_STATE_JSON:-}
      OLR_KALCB_POSITIONS_JSON: ${OLR_KALCB_POSITIONS_JSON:-}
      OLR_KALCB_POLL_SECONDS: ${OLR_KALCB_POLL_SECONDS:-15}
    depends_on:
      oms:
        condition: service_healthy
    profiles:
      - olr-kalcb
      - all
    command: ["sh", "/app/deployment/olr_kalcb/runtime_service_entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ===========================================
  # Dashboard: optional Postgres-backed monitoring UI
  # ===========================================
  dashboard:
    <<: *common
    build:
      context: ./infra/dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trading_writer:${POSTGRES_WRITER_PASSWORD:-changeme}@postgres:5432/trading
      KIS_IS_PAPER: ${KIS_IS_PAPER:-true}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dashboard
      - all

  # ===========================================
  # Postgres Database
  # ===========================================
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  kstock:
    driver: bridge

volumes:
  postgres_data:
  rate_budget:
