diagnostic_limitations:
- Research-round adoption of retained I0 under N0 execution, not a new alpha improvement
  or completed economic optimisation objective.
- All IS and April-July OOS have been adaptively consumed; they are development evidence,
  not untouched validation.
- N0 differs from historical I0 in execution/event grids. Source-model return differences
  are not policy alpha.
- Physical queue/latency liquidity, paper/live parity and production deployment remain
  unqualified; no live configuration is changed.
- Fixed 103-name universe and sector taxonomy create selection/survivorship limitations;
  no benchmark-adjusted alpha or persistence probability is established.
- Combined stress changes costs and interval participation, not measured exchange
  queue dynamics. Capped sizing limits upward compounding, not downside loss.
- Each OOS scenario restores its own IS observed capacity history but resets cash/positions.
  Independent account returns are not a continuous portfolio return.
- Legacy-feed capacity observations and sparse actual auction events remain explicit
  assumptions. Opening fills are disabled under the interval model.
- Risk is full opening/interval/closing/fill-event MTM. Native coarser risk is retained
  separately. Positive returns do not imply recovered drawdown.
- 'No hard stop is active: failed-followthrough/fade and planned auction exits obey
  available service. Admission risk budgets do not guarantee realised-loss limits.'
- Combined cost/participation stress is evaluated jointly; separate single-factor
  stress and real queue calibration are not established by this six-account matrix.
adoption_basis: Explicit user adoption after D29 review; cross-source round1 performance
  is not a same-policy alpha gate. Native validity remains mandatory.
